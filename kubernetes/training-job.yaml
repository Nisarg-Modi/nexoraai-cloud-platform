apiVersion: batch/v1
kind: Job
metadata:
  name: fraud-training
  namespace: mlops
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: training
        image: asia-south1-docker.pkg.dev/devops-500306/nexoraai-mlops/training:v1
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
