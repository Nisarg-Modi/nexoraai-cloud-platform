apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-model
  namespace: mlops
spec:
  predictor:
    model:
      modelFormat:
        name: sklearn
      storageUri: gs://mlops-506205-nexoraai-mlops/models/
      volumeMounts:
        - name: kserve-provision-location
          mountPath: /mnt/models
    initContainers:
      - name: storage-initializer
        image: google/cloud-sdk:slim
        command:
          - sh
          - -c
          - |
            mkdir -p /mnt/models
            gsutil cp gs://mlops-506205-nexoraai-mlops/models/fraud_model.pkl /mnt/models/model.pkl
        volumeMounts:
          - name: kserve-provision-location
            mountPath: /mnt/models
    volumes:
      - name: kserve-provision-location
        emptyDir: {}
